
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak dan Saran - Saif Nikmatullah</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Saif Nikmatullah</h1>
        <p>Mahasiswa Teknik Informatika</p>

        <nav>
            <a href="index.html">Home</a>
            <a href="kontak.html">Kontak/Saran</a>
        </nav>
    </header>

    <main class="contact-container">

        <section class="contact-form">
            <h2>Hubungi Saya</h2>

            <form action="#" method="get">

                <p>
                    <label for="nama">Nama Lengkap:</label>
                    <input type="text" id="nama" name="nama"
                        placeholder="Masukkan nama lengkap"
                        minlength="3" maxlength="50" required>
                </p>

                <p>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email"
                        placeholder="contoh@email.com" required>
                </p>

                <p>
                    <label for="telepon">Nomor Telepon:</label>
                    <input type="tel" id="telepon" name="telepon"
                        placeholder="08xxxxxxxxxx"
                        pattern="[0-9]{10,12}"
                        title="Masukkan nomor telepon 10-12 digit"
                        required>
                </p>

                <p>
                    <label for="tanggal">Tanggal Mengirim Pesan:</label>
                    <input type="date" id="tanggal" name="tanggal"
                        min="2026-10-19" required>
                </p>

                <p>
                    <label for="kategori">Kategori Pesan:</label>
                    <select id="kategori" name="kategori" required>
                        <option value="">Pilih Kategori</option>
                        <option value="pertanyaan">Pertanyaan</option>
                        <option value="saran">Saran</option>
                        <option value="keluhan">Keluhan</option>
                    </select>
                </p>

                <p>
                    <label for="kepuasan">Tingkat Kepuasan (1-5):</label>
                    <input type="number" id="kepuasan" name="kepuasan"
                        min="1" max="5" required>
                </p>

                <p>
                    <label for="pesan">Pesan atau Saran:</label>
                    <textarea id="pesan" name="pesan"
                        placeholder="Tulis pesan Anda di sini..."
                        rows="5" required></textarea>
                </p>

                <div class="form-buttons">
                    <button type="submit" class="btn-submit">
                        Kirim Pesan
                    </button>

                    <button type="reset" class="btn-reset">
                        Reset Form
                    </button>
                </div>

            </form>
        </section>

        <aside class="contact-info">
            <h2>Informasi</h2>
            <p>Silakan isi formulir dengan data yang benar.</p>
            <p>Semua kolom wajib diisi sebelum formulir dikirim.</p>
        </aside>

    </main>

    <footer>
        <p>&copy; 2026 Saif Nikmatullah. Hak cipta dilindungi.</p>
        <p>
            <a href="index.html">Kembali ke Halaman Utama</a>
        </p>
    </footer>

</body>
</html>
